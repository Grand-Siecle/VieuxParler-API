version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vieuxparler-api
    ports:
      - "8000:8000"
    volumes:
      - ./freem_lstm_fairseq:/app/freem_lstm_fairseq:ro
      - ./logs:/logs
    environment:
      - MODEL_DIR=/app/freem_lstm_fairseq
      - CHECKPOINT_FILE=model/checkpoint_best.pt
      - DATA_DIR=data_norm_bin_4000
      - BPE_MODEL=bpe_joint_4000.model
      - DEVICE=auto          # auto | cpu | cuda
      - BEAM_SIZE=5
      - MAX_TOKENS=200
      - WORKERS=1
      - LOG_LEVEL=info
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
